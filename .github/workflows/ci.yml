name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core only)
        run: |
          python -m pip install -U pip
          pip install -e . pytest pytest-cov hypothesis
      - name: Tests without the GUI extra (the GUI test must skip, not fail)
        run: pytest
      - name: Install the GUI extra and dev tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests including the GUI (offscreen)
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install build
          python -m build
          pip install dist/*.whl
          knvrt convert 5 km mi
          knvrt calc ohms-law v='12 V' r='470 ohm'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
